# إعداد Netlify للنسخة الجديدة v2 (app/ → deploy/).
#
# عند ربط المستودع بـ Netlify (استيراد من GitHub) يُبنى تطبيق Vite في app/
# ويُنشر ناتجه من deploy/ — بلا أي متغيرات بيئة (المفاتيح العامة مضمّنة).
#
# ⚠️ مهم: اختر الفرع الصحيح في إعدادات Netlify (Branch to deploy) —
# الفرع الذي يحتوي app/ و deploy/.
#
# ملاحظات:
# - النشر اليدوي بالسحب لا يقرأ هذا الملف إطلاقاً: اسحب مجلد deploy/ كاملاً وينتهي.
# - نسخة web/ (Next.js) لم تعد هدف البناء الافتراضي؛ لنشرها أنشئ موقعاً منفصلاً
#   واضبط Base directory = web يدوياً في واجهة Netlify (مع متغيرات البيئة).
# ⚠️ **الاختبارات قبل البناء**: هذا البناء هو ما يُنشر على الإنتاج
# (`neon-frangollo-2c189e` مربوطٌ بالمستودع)، فلا بوّابة غيره بين `main`
# والزبون. فحص الأنواع داخل `npm run build`، والاختبارات هنا — وسقوطها يُبقي
# النشر السابق قائماً. (والمتصفّح في CI على كل طلب دمج.)
[build]
  command = "cd app && npm ci && npm test && npm run build"
  publish = "deploy"

[build.environment]
  NODE_VERSION = "22"

# حقن وسوم المشاركة لصفحة المنيو قبل أن تصل الزاحف (واتساب لا يشغّل JS).
# المسارات المستبعَدة معرَّفة في `config` داخل الدالة نفسها — أقرب إلى منطقها.
[[edge_functions]]
  function = "menu-meta"
  path = "/*"
