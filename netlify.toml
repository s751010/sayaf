# ═══════════════════════════════════════════════════════════════════
#  إعداد Netlify — النسخة الرسمية هي تطبيق Next.js في web/
# ═══════════════════════════════════════════════════════════════════
#
# base = "web" يجعل الموقع المربوط بـ Git يبني التطبيق الصحيح حتى لو كانت
# خانة "Base directory" في واجهة Netlify فارغة أو خاطئة.
#
# publish = ".next" (نسبةً إلى base) مثبَّتة صراحةً لتتجاوز أي قيمة عالقة في
# إعدادات الواجهة — محوّل Next يحوّلها إلى نشر SSR كامل أثناء البناء.
#
# ⚠️ plugin محوّل Next مثبَّت صراحةً عمداً: الاكتشاف التلقائي لا يعمل في هذا
# الموقع (سبق أن أظهر الـAPI العام plugin_state = none على نشرات ناجحة ظاهرياً
# لكنها تخدم 404 على كل مسار). بدون المحوّل يُنشر .next كملفات خام بلا خادم SSR.
#
# متغيّرات البيئة المطلوبة في واجهة Netlify (Site settings → Environment):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, FOUNDER_EMAIL
# انظر web/.env.example. أسرار الدفع ليست هنا — مكانها أسرار دوال Supabase.
#
# النسخة الثابتة v2 (app/ → deploy/) تبقى في المستودع كخطة رجوع سريعة:
# يمكن نشرها بسحب مجلد deploy/ يدوياً إلى Netlify، والسحب اليدوي لا يقرأ هذا
# الملف إطلاقاً.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
