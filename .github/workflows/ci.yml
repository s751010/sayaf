# فحص كل دفعة وكل طلب دمج.
#
# ⚠️ لم يكن في المستودع `.github/` إطلاقاً: صفر اختبار وصفر فحص آليّ، وكل
# ضمانة كانت «شغّل typecheck قبل الدفع» مكتوبةً في CLAUDE.md — أي اعتماد على
# التذكّر. وأخطر ما يحرسه هذا الملفّ **فحوص التكافؤ**: ثلاثة أزواج من الملفات
# مكتوبة بيد مرّتين، ولكل زوج عطل وقع فعلاً من تباعد نسخة عن أصلها.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# دفعة جديدة على نفس الفرع تُلغي سابقتها — لا فائدة من فحص شيفرة تجاوزها العمل.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# أقلّ صلاحية تكفي: الفحص يقرأ المستودع ولا يكتب فيه شيئاً.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # سقفٌ صريح: المعتاد دقيقة ونصف، وفحصٌ عالق يستهلك ٣٦٠ دقيقة بلا سقف.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      # ⚠️ الإجراءات مثبّتة بالـSHA لا بالوسم: الوسم `v4` يمكن أن يُنقل إلى شيفرة
      # أخرى بلا علمنا، والـSHA لا يتغيّر. القيمة هي ما يشير إليه `v4` يوم التثبيت
      # (١٦ أكتوبر ٢٠٢٦)، فلا تغيير في السلوك. نمطٌ مأخوذ من
      # practical-tutorials/project-based-learning.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # نفس نسخة `netlify.toml` — فحصٌ على نسخة أخرى يفحص بناءً غير الذي يُنشَر.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # أوّلاً لأنه الأسرع (ثانية واحدة، بايثون بلا تبعيات): نسخة القائمة لم
      # تُحرَّر بيد، وفحص المنبع يمرّ عليها، وكل رابط تقترحه المهارة موجودٌ فيها.
      - name: فحص مهارة project-based-learning
        working-directory: .
        run: python3 .claude/skills/project-based-learning/scripts/selftest.py

      - run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: الاختبارات
        run: npm test

      - name: البناء
        # ⚠️ `SKIP_SITEMAP` يمنع سكربت الخريطة من قراءة قاعدة الإنتاج على كل
        # دفعة. الخريطة تُولَّد في بناء Netlify حيث تُنشَر فعلاً — وتوليدها هنا
        # يُرمى مع مجلد العمل، ويُتعب القاعدة بلا مقابل.
        env:
          SKIP_SITEMAP: "1"
        run: npm run build

      # ⚠️ **الطبقة التي كانت مفقودة.** عطل `React #310` أطفأ كل منيو ومرّ من
      # الثلاث خطوات أعلاه جميعاً، لأن لا واحدة منها تفتح متصفّحاً. وكروميوم
      # وحده يُنزَّل (لا فَيَرفُكس ولا ويبكِت): الفحص فحص إقلاعٍ لا توافقِ
      # متصفّحات، وثلاثة متصفّحات تعني ثلاثة أضعاف الزمن لنفس الجواب.
      - name: تنزيل كروميوم
        run: npx playwright install --with-deps chromium

      - name: فحص المتصفّح
        run: npm run e2e

# ثابت §18 (ألوان الطوابع) يحرسه `invariants.test.ts` ببصمة تفشل بصوت عالٍ —
# ولا يحتاج خطوة git إضافية هنا: خطوةٌ تعتمد على عمق الاستنساخ وعلى
# `github.base_ref` تنكسر بصمت في حالات، وحارسٌ ينكسر بصمت أسوأ من لا حارس.
